name: 'CI Next.js - Peminjaman Barang'

on:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ambil kode dari repository
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install library (npm install)
        run: npm ci

      - name: 4. Build aplikasi Next.js (Cek Error)
        run: npm run build